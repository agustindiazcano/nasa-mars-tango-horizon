<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Tango Horizon - Model lab</title>
    <style>
      :root { color-scheme: dark; --bg: #1c130e; --panel: #2a1d16; --line: #5b3d2a; --fg: #f2e2d0; --dim: #b49880; --accent: #ffb347; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 "IBM Plex Mono", ui-monospace, Consolas, monospace; }
      body { display: grid; grid-template-columns: 300px 1fr; grid-template-rows: auto 1fr; }
      header { grid-column: 1 / 3; display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
      header h1 { font-size: 14px; margin: 0 16px 0 0; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
      header button { background: transparent; color: var(--fg); border: 1px solid var(--line); padding: 4px 12px; cursor: pointer; font: inherit; }
      header button.on { border-color: var(--accent); color: var(--accent); }
      aside { padding: 12px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; gap: 10px; }
      aside section { display: flex; flex-direction: column; gap: 6px; }
      aside h2 { margin: 6px 0 0; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
      label { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
      select, input[type="range"], button.act { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 4px; font: inherit; }
      button.act { cursor: pointer; width: auto; flex: 1; }
      .row { display: flex; gap: 6px; flex-wrap: wrap; }
      .readout { color: var(--dim); white-space: pre-wrap; }
      #stage, #sheet { grid-column: 2; grid-row: 2; }
      #stage { position: relative; min-height: 0; }
      #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #sheet { display: none; padding: 12px; overflow-y: auto; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; align-content: start; }
      #sheet figure { margin: 0; border: 1px solid var(--line); background: var(--panel); }
      #sheet img { width: 100%; display: block; aspect-ratio: 4 / 3; object-fit: cover; }
      #sheet figcaption { padding: 4px 8px; color: var(--dim); }
      body.sheet #stage { display: none; }
      body.sheet #sheet { display: grid; }
      .hidden { display: none !important; }
      #log { color: #ff9a8a; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <header>
      <h1>Model lab</h1>
      <button id="tab-models" class="on">Models</button>
      <button id="tab-sheet">Contact sheet</button>
      <button id="tab-closeup">Close-up</button>
    </header>
    <aside>
      <section id="sec-models">
        <h2>Model</h2>
        <select id="model"></select>
        <div class="row">
          <button class="act" data-cam="orbit">Orbit</button>
          <button class="act" data-cam="top">Top</button>
          <button class="act" data-cam="front">Front</button>
          <button class="act" data-cam="side">Side</button>
        </div>
        <label><span>Wireframe</span><input id="wire" type="checkbox" /></label>
        <div id="readout" class="readout"></div>
        <div id="anim-box" class="hidden">
          <h2>Animation</h2>
          <select id="clip"></select>
          <label><span>Speed <b id="speed-val">1.0</b>x</span></label>
          <input id="speed" type="range" min="0" max="2" step="0.05" value="1" />
          <label><span>Locomotion blend</span><input id="blend" type="checkbox" /></label>
          <label class="hidden" id="blend-row"><span>Ground speed <b id="gs-val">0.0</b> m/s</span></label>
          <input id="gs" class="hidden" type="range" min="0" max="4.5" step="0.05" value="0" />
        </div>
      </section>
      <section id="sec-sheet" class="hidden">
        <h2>Contact sheet</h2>
        <div class="readout">Renders every model from the same 3/4 view. Used to identify asset-1..4 and to check the budgets.</div>
        <button class="act" id="sheet-run">Render all</button>
        <div id="sheet-status" class="readout"></div>
      </section>
      <section id="sec-closeup" class="hidden"></section>
      <section>
        <h2>Self-check</h2>
        <button class="act" id="selfcheck">Load every model and clip</button>
        <div id="check-status" class="readout"></div>
        <div id="log"></div>
      </section>
    </aside>
    <div id="stage"><canvas id="canvas"></canvas></div>
    <div id="sheet"></div>
    <script type="module" src="/src/lab/modelLab.ts"></script>
  </body>
</html>
