name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm -w shared run test

  test-server:
    runs-on: ubuntu-latest
    env:
      AGENTS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm -w shared run build
      - run: npm -w server run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy-cloudrun:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-shared, test-server, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/291271901218/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "tango-horizon-cd@nasa-tango-horizon.iam.gserviceaccount.com"
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy backend to Cloud Run
        run: bash ./deploy.sh
