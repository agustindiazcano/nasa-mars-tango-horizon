<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Tango Horizon · 3D Test Remote</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #050a10;
      color: #35e0ff;
      font: 600 15px/1.3 ui-monospace, system-ui, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #start {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(5, 10, 16, 0.96);
      font-size: 20px;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    #ui {
      display: grid;
      grid-template-rows: auto 1fr 84px 54px 44px;
      height: 100%;
      gap: 10px;
      padding: 12px;
      box-sizing: border-box;
    }
    #status {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-align: center;
      opacity: 0.85;
    }
    button, #pad {
      border: 2px solid currentColor;
      border-radius: 14px;
      background: rgba(53, 224, 255, 0.08);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    #pad {
      display: grid;
      place-items: center;
      font-size: 20px;
    }
    #pad.down {
      background: rgba(53, 224, 255, 0.28);
    }
    #ptt.on {
      background: #ff2a55;
      border-color: #ff2a55;
      color: #fff;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .small-btn {
      font-size: 12px;
      border-width: 1px;
    }
  </style>
</head>
<body>
  <div id="start"><span id="start-label">Tap to connect</span></div>
  <div id="ui">
    <div id="status">ROOM · INITIALIZING</div>
    <div id="pad">SELECT</div>
    <button id="ptt">HOLD TO TALK</button>
    <div class="row">
      <button id="recenter">RECENTER</button>
      <button id="mode">MODE: POINTER</button>
    </div>
    <div class="row">
      <button id="invx" class="small-btn">Invert X: OFF</button>
      <button id="invy" class="small-btn">Invert Y: OFF</button>
    </div>
  </div>
  <script type="module" src="/src/remote/phoneClient.ts"></script>
</body>
</html>
